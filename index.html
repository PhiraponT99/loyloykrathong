<title>ลอยกระทงออนไลน์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&family=Sarabun:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen river canvas; controls float on top (sound top-right, actions bottom), the form opens as a bottom sheet. Single deliberate night look. */
:root{
  --ink:#070a1c; --sheet:#0f1436; --sheet2:#182055; --line:#2f3878;
  --fg:#f3f1ff; --mute:#aab0de; --gold:#f5c35a; --gold-ink:#2a1800;
  --f-display:'Kanit','Sarabun',system-ui,sans-serif;
  --f-body:'Sarabun','Kanit',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:5}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(10,14,44,.62);color:var(--fg);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:42px}
.pill svg{width:18px;height:18px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(4,6,26,.75),rgba(4,6,26,0))}
.btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:600;font-size:19px;cursor:pointer;min-height:52px;box-shadow:0 6px 30px rgba(245,195,90,.35)}
.btn.ghost{background:rgba(10,14,44,.62);color:var(--fg);border:1px solid rgba(255,255,255,.22);box-shadow:none;font-size:16px;font-weight:400;padding:12px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:6;background:rgba(10,14,44,.8);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 14px;font-size:15px;max-width:calc(100% - 32px);text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.toast:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(2,3,14,.5);z-index:8}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:9;width:min(560px,100%);max-height:88%;overflow-y:auto;
  background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-size:14px;color:var(--mute);letter-spacing:.02em}
input,textarea{width:100%;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:17px}
textarea{min-height:84px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:6px 4px 8px;color:var(--fg);font:inherit;font-size:12.5px;line-height:1.25;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.tile canvas{width:100%;max-width:84px;aspect-ratio:1;height:auto;display:block}
.tile span{overflow-wrap:anywhere;text-align:center}
.tile[aria-checked="true"]{border-color:var(--gold);background:var(--sheet2);box-shadow:inset 0 0 0 1px var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chip{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:40px}
.count{font-size:13px;color:var(--mute)}
.sheet .btn{width:100%}
.hint{font-size:13.5px;color:var(--mute);margin:0}
.stat{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:5;background:rgba(10,14,44,.62);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:6px 14px 8px;line-height:1.2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stat small{display:block;font-size:12.5px;color:var(--mute)}
.stat b{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--gold);font-variant-numeric:tabular-nums}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;width:min(440px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;
  background:linear-gradient(#fffaf0,#fbe8c8);color:#4a2c10;border-radius:22px;padding:26px 22px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.modal .orn{width:64px;height:28px}
.modal h2{font-family:var(--f-display);font-weight:600;color:#8a4b17;margin:0;font-size:24px}
.modal .from{margin:0;color:#7a5a3a;font-size:15px}
.modal blockquote{margin:6px 0;width:100%;background:#fff;border:1px solid #efd9b2;border-radius:14px;padding:16px;font-family:var(--f-display);font-size:19px;font-weight:600;color:#3a2410;overflow-wrap:anywhere}
.modal .x{position:absolute;top:10px;right:10px;color:#4a2c10;border-color:#e6cfa8}
.btn.brown{background:#a8622a;color:#fff;box-shadow:none;margin-top:6px}
.modal .btn:disabled{opacity:.75}
.media img,.media video{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#000;display:block}
@media (max-width:520px){ .types{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:440px){ .bar{gap:8px} .bar .btn{padding:12px 18px;font-size:17px;min-height:46px} .bar .btn.ghost{padding:10px 12px;font-size:14.5px} .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))} }
@media (max-width:360px){ .types{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>

<canvas id="c" role="img" aria-label="แม่น้ำยามค่ำคืน มีวัดอรุณ พระจันทร์เต็มดวง โคมลอย และกระทงลอยอยู่"></canvas>

<div class="stat" aria-live="polite"><small>ยอดร่วมลอยกระทง</small><b id="statN">0</b></div>

<div class="top">
  <button type="button" class="pill" id="sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <span id="soundTxt">เปิดเพลง</span>
  </button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">แตะที่ไหนก็ได้เพื่อเปิดเพลง</div>

<div class="bar" id="barIdle">
  <button type="button" class="btn" id="open">ลอยกระทงของคุณ</button>
</div>
<div class="bar" id="barDone" hidden>
  <button type="button" class="btn ghost" id="vid">บันทึกวิดีโอ</button>
  <button type="button" class="btn ghost" id="png">บันทึกรูป</button>
  <button type="button" class="btn" id="again">ลอยอีกใบ</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="form" hidden aria-labelledby="formTitle" role="dialog" aria-modal="true">
  <div class="shead"><h2 id="formTitle">ลอยกระทงของคุณ</h2><button type="button" class="x" data-close aria-label="ปิด">×</button></div>
  <div class="field">
    <span class="lbl" id="lblType">เลือกกระทง</span>
    <div class="types" role="radiogroup" aria-labelledby="lblType" id="types"></div>
  </div>
  <div class="field">
    <label for="name">ชื่อผู้ลอย</label>
    <input id="name" maxlength="24" autocomplete="off" placeholder="ชื่อเล่น หรืออะไรก็ได้">
  </div>
  <div class="field">
    <label for="wish">คำอธิษฐาน</label>
    <textarea id="wish" maxlength="90" placeholder="เขียนคำอธิษฐานของคุณ"></textarea>
    <div class="row"><button type="button" class="chip" id="rand">สุ่มคำอธิษฐาน</button><span class="count"><span id="cnt">0</span>/90</span></div>
  </div>
  <p class="hint" id="shareNote"></p>
  <button type="button" class="btn" id="go">ปล่อยกระทงลงน้ำ</button>
</section>

<section class="modal" id="wishModal" hidden role="dialog" aria-modal="true" aria-labelledby="wmTitle">
  <button type="button" class="x" data-close aria-label="ปิด">×</button>
  <svg class="orn" viewBox="0 0 64 28" aria-hidden="true"><path d="M32 2c5 6 6 14 0 22-6-8-5-16 0-22z" fill="#e85a8c"/><path d="M32 24c-6-3-12-9-14-17 7 1 12 6 14 17zM32 24c6-3 12-9 14-17-7 1-12 6-14 17z" fill="#f48bb0"/><path d="M32 24c-9 0-16-4-20-10 8-1 15 3 20 10zM32 24c9 0 16-4 20-10-8-1-15 3-20 10z" fill="#f9b5cc"/></svg>
  <h2 id="wmTitle">คำอธิษฐานบนสายน้ำ</h2>
  <p class="from">จาก <span id="wmName"></span></p>
  <blockquote id="wmWish"></blockquote>
  <p class="from" id="wmCount"></p>
  <button type="button" class="btn brown" id="wmAmen">ขอให้คำอธิษฐานเป็นจริง</button>
</section>

<section class="sheet" id="result" hidden aria-labelledby="resTitle" role="dialog" aria-modal="true">
  <div class="shead"><h2 id="resTitle">ไฟล์สำหรับ Story</h2><button type="button" class="x" data-close aria-label="ปิด">×</button></div>
  <div class="media" id="media"></div>
  <button type="button" class="btn" id="save">บันทึกลงเครื่อง</button>
  <p class="hint">ถ้าปุ่มบันทึกใช้ไม่ได้ ให้กดค้างที่รูปหรือวิดีโอแล้วเลือกบันทึก จากนั้นเปิดจากคลังภาพไปลง IG หรือ Facebook Story</p>
</section>

<script>
(() => {
'use strict';
const H = 1920, HY = 980, END = 14, TAU = Math.PI * 2;
let LW = 1080, CX = 540;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ---------- helpers ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const fnv = s => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8, '0'); };
/* soft light: a pre-rendered radial sprite per colour, stretched and faded, instead of a new gradient every call */
const GLOWS = new Map();
function glowSprite(rgb) {
  let c = GLOWS.get(rgb); if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 128;
  const g2 = c.getContext('2d'), g = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(1, `rgba(${rgb},0)`); g2.fillStyle = g; g2.fillRect(0, 0, 128, 128);
  GLOWS.set(rgb, c); return c;
}
function glow(x, y, r, rgb, a) { if (a <= 0 || r <= 0) return; const pa = ctx.globalAlpha; ctx.globalAlpha = pa * Math.min(1, a); ctx.drawImage(glowSprite(rgb), x - r, y - r, r * 2, r * 2); ctx.globalAlpha = pa; }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function txt(s, x, y, font, color, align = 'left') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
const seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
function wrap(str, maxW, font, maxLines) {
  ctx.font = font;
  const toks = seg ? Array.from(seg.segment(str), s => s.segment) : Array.from(str), flat = [];
  for (const t of toks) { if (ctx.measureText(t).width > maxW) flat.push(...Array.from(t)); else flat.push(t); }
  const lines = []; let cur = '';
  for (const t of flat) { const test = cur + t; if (cur && ctx.measureText(test).width > maxW) { lines.push(cur.trim()); cur = t.replace(/^\s+/, ''); } else cur = test; }
  if (cur.trim()) lines.push(cur.trim());
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/.$/, '') + '…'; }
  return lines;
}
function fit(str, maxW, family, weight, start, min) { let s = start; ctx.font = `${weight} ${s}px ${family}`; while (s > min && ctx.measureText(str).width > maxW) { s -= 2; ctx.font = `${weight} ${s}px ${family}`; } return ctx.font; }
const KANIT = "Kanit, Sarabun, sans-serif", SARA = "Sarabun, Kanit, sans-serif", MONO = "'JetBrains Mono', ui-monospace, Menlo, monospace";

/* ---------- scene (one traditional river) ---------- */
const R = rng(20261124);
const STARS = Array.from({ length: 160 }, () => ({ x: R(), y: -500 + R() * (HY + 440), r: .6 + R() * 1.8, p: R() * TAU }));
const LANT = Array.from({ length: 28 }, () => ({ x: R(), off: R() * 1500, sp: 18 + R() * 30, s: 8 + R() * 14, p: R() * TAU }));
const OTHERS = Array.from({ length: 26 }, (_, i) => ({ x: R(), d: .04 + R() * .96, sp: 3 + R() * 6, p: R() * TAU, k: i % 9 === 4 ? 'hex' : i % 9 === 7 ? 'ascii' : (R() < .5 ? 'pink' : R() < .6 ? 'gold' : 'white') })).sort((a, b) => a.d - b.d);

const R3 = rng(1124);
const CLOUDS = Array.from({ length: 14 }, () => ({ x: R3(), y: 180 + R3() * 620, l: 260 + R3() * 520, w: 10 + R3() * 26, a: -.32 + R3() * .14, c: R3() }));
function sky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, HY);
  [[0, '#0a1550'], [.45, '#2a3394'], [.75, '#7a3f99'], [.92, '#d0607a'], [1, '#f39a5e']].forEach(s => g.addColorStop(s[0], s[1]));
  ctx.fillStyle = '#0a1550'; ctx.fillRect(0, -1200, LW, 1200);
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, HY + 2);
  for (const s of STARS) if (s.y < 520) { ctx.fillStyle = `rgba(255,248,225,${.3 + .45 * Math.abs(Math.sin(t * .8 + s.p))})`; ctx.fillRect(s.x * LW, s.y, s.r, s.r); }
  for (const c of CLOUDS) {
    const x = ((c.x * (LW + 600) + t * 4) % (LW + 600)) - 300;
    ctx.save(); ctx.translate(x, c.y); ctx.rotate(c.a);
    const cg = ctx.createLinearGradient(-c.l / 2, 0, c.l / 2, 0), col = c.c < .4 ? '255,120,70' : c.c < .75 ? '240,90,150' : '255,170,90', al = .18 + (c.y / 800) * .22;
    cg.addColorStop(0, `rgba(${col},0)`); cg.addColorStop(.35, `rgba(${col},${al})`); cg.addColorStop(.7, `rgba(${col},${al * .8})`); cg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = cg; ell(0, 0, c.l / 2, c.w); ctx.fill(); ctx.restore();
  }
}
function moon() {
  const x = CX - 310, y = 690, r = 92;
  glow(x, y, 330, '255,235,190', .32); ctx.fillStyle = '#fff1c9'; ell(x, y, r, r); ctx.fill();
  ctx.fillStyle = 'rgba(214,180,120,.32)'; ell(x - 24, y - 12, 18, 16); ctx.fill(); ell(x + 26, y + 22, 24, 22); ctx.fill(); ell(x + 6, y - 36, 12, 11); ctx.fill();
}
function lanterns(t) {
  for (const l of LANT) {
    const y = HY - 10 - ((l.off + t * l.sp) % 1500), x = l.x * LW + Math.sin(t * .5 + l.p) * 24;
    const fade = clamp((HY - y) / 120, 0, 1) * clamp((y + 400) / 300, 0, 1); if (fade <= 0) continue;
    const fl = .75 + .25 * Math.sin(t * 6 + l.p);
    glow(x, y, l.s * 4, '255,170,60', .38 * fade * fl); ctx.fillStyle = `rgba(255,214,140,${.95 * fade})`; ell(x, y, l.s * .55, l.s * .8); ctx.fill();
  }
}
/* Wat Arun prang: stepped terraces, then a smooth corn-cob tower tapering to a trident */
const TER = [[.5, 0], [.5, .06], [.42, .06], [.42, .13], [.35, .13], [.35, .2], [.28, .2], [.28, .27], [.22, .27], [.22, .33], [.2, .33]];
const COB = [[.2, .33], [.19, .45], [.165, .58], [.125, .7], [.085, .8], [.055, .86], [.035, .91], [.02, .955], [.008, 1]];
function prangPath(cx, by, w, h) {
  const X = f => cx + f * w, Y = f => by - f * h;
  ctx.beginPath(); ctx.moveTo(X(-.5), Y(0));
  for (const [a, b] of TER) ctx.lineTo(X(a), Y(b));
  for (let i = 1; i < COB.length; i++) { const [a0, b0] = COB[i - 1], [a1, b1] = COB[i]; ctx.quadraticCurveTo(X(a0), Y(b0), X((a0 + a1) / 2), Y((b0 + b1) / 2)); }
  ctx.lineTo(X(0), Y(1));
  for (let i = COB.length - 1; i > 0; i--) { const [a0, b0] = COB[i], [a1, b1] = COB[i - 1]; ctx.quadraticCurveTo(X(-a0), Y(b0), X(-(a0 + a1) / 2), Y((b0 + b1) / 2)); }
  for (let i = TER.length - 1; i >= 0; i--) ctx.lineTo(X(-TER[i][0]), Y(TER[i][1]));
  ctx.closePath();
}
function halfAt(f) { for (let i = 1; i < COB.length; i++) if (f <= COB[i][1]) { const [a0, b0] = COB[i - 1], [a1, b1] = COB[i]; return lerp(a0, a1, (f - b0) / (b1 - b0)); } return 0; }
function prang(cx, by, w, h, lit) {
  const g = ctx.createLinearGradient(0, by, 0, by - h);
  g.addColorStop(0, '#fff3c4'); g.addColorStop(.35, '#ffd66a'); g.addColorStop(.75, '#f0a83a'); g.addColorStop(1, '#c97a2a');
  prangPath(cx, by, w, h); ctx.fillStyle = g; ctx.fill();
  ctx.save(); prangPath(cx, by, w, h); ctx.clip();
  const sh = ctx.createLinearGradient(cx - w * .3, 0, cx + w * .3, 0); sh.addColorStop(0, 'rgba(255,255,230,.25)'); sh.addColorStop(.5, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(120,50,20,.35)');
  ctx.fillStyle = sh; ctx.fillRect(cx - w * .5, by - h, w, h);

function amenCount(id) { return (COMM.counts.get(id) || 0) + (COMM.myAmens.has(id) && !COMM.serverAmens.has(id) ? 1 : 0); }
